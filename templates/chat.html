<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBOT</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0b1020; color: #e8ebff; }
    header { padding: 16px; background: #111735; border-bottom: 1px solid #27306b; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    #chat { background: #0e1430; border: 1px solid #27306b; border-radius: 12px; padding: 12px; height: 70vh; overflow-y: auto; }
    .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
    .user { background: #1a2454; align-self: flex-end; }
    .assistant { background: #121a3f; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input, textarea, button, select { border-radius: 8px; border: 1px solid #27306b; background: #0e1430; color: #e8ebff; padding: 10px; }
    textarea { flex: 1; resize: vertical; min-height: 48px; }
    button { background: #3041d8; border: none; cursor: pointer; padding: 10px 16px; }
    button:disabled { opacity: 0.6; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    small { opacity: 0.7; }
  </style>
</head>
<body>
<header>
  <strong>ChatBOT (OpenAI)</strong>
</header>
<main>
  <div class="row">
    <label for="model">مدل:</label>
    <select id="model">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option>
      <option value="gpt-4.1-mini">gpt-4.1-mini</option>
    </select>
    <label for="temperature">خلاقیت:</label>
    <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" style="width:90px" />
  </div>

  <div id="chat"></div>

  <form id="chat-form">
    <textarea id="message" placeholder="پیام خود را بنویسید..."></textarea>
    <button type="submit">ارسال</button>
  </form>
  <small>نکته: برای استفاده از این چت، باید متغیر محیطی OPENAI_API_KEY روی سرور تنظیم شده باشد.</small>
</main>

<script>
  const chatBox = document.getElementById('chat');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('message');
  const modelSel = document.getElementById('model');
  const tempInput = document.getElementById('temperature');

  const messages = [];

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = content;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', text);
    messages.push({ role: 'user', content: text });
    input.value = '';
    form.querySelector('button').disabled = true;

    try {
      const res = await fetch('/api/openai/chat/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, model: modelSel.value, temperature: parseFloat(tempInput.value || '0.7') })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.detail || 'خطا در پاسخ');
      const reply = data.reply || '';
      messages.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);
    } catch (err) {
      addMessage('assistant', 'خطا: ' + err.message);
    } finally {
      form.querySelector('button').disabled = false;
    }
  });
</script>
</body>
</html>
